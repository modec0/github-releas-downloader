name: Download, Zip and Save Artifact (Fixed)

on:
  workflow_dispatch:

permissions:
  actions: write   # اجباری برای آپلود Artifact در برخی سازمان‌ها
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Download file
        run: |
          curl -L https://github.com/sinavm/melishekan/releases/download/v1.0/melishekan-nv_01.npv -o melishekan-nv_01.npv
          echo "✅ دانلود شد. فایل وجود دارد:"
          ls -lh melishekan-nv_01.npv

      - name: Zip file
        run: |
          zip melishekan-nv_01.zip melishekan-nv_01.npv
          echo "✅ زیپ شد. فایل زیپ:"
          ls -lh melishekan-nv_01.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: melishekan-zipped
          path: melishekan-nv_01.zip
          if-no-files-found: error
          retention-days: 7
