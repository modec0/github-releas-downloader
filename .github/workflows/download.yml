name: Download, Zip, Create Release and Save Artifact

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title'
        required: true
        default: 'melishekan-nv_01 release'

permissions:
  contents: write
  actions: write   # اضافه شد برای اطمینان از دسترسی به آپلود artifact

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download file
        run: |
          curl -L https://github.com/sinavm/melishekan/releases/download/v1.0/melishekan-nv_01.npv -o melishekan-nv_01.npv
          # بررسی اینکه فایل دانلود شده وجود دارد
          ls -la melishekan-nv_01.npv

      - name: Zip the downloaded file
        run: |
          zip melishekan-nv_01.zip melishekan-nv_01.npv
          # بررسی اینکه فایل zip ساخته شده است
          ls -la melishekan-nv_01.zip

      - name: Upload artifact (ZIP file)
        uses: actions/upload-artifact@v4
        with:
          name: melishekan-nv_01-zipped
          path: melishekan-nv_01.zip
          retention-days: 7
          if-no-files-found: error   # اگر فایل نباشد، کار را با خطا متوقف می‌کند

      - name: Create Release and upload zip
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          files: melishekan-nv_01.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
